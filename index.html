<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Killer</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Find the Killer</h1>
</header>

<main>

    <section id="notebook">
        <h2>Notebook</h2>

        <textarea placeholder="Type your notes here..."></textarea>
    </section>

    <section id="witnesses">
    <h2>Witness's</h2>

    <div class="witnessList">

        <button class="witnessBtn" data-image="images/witness1_large.png">
            <img src="images/witness1_thumb.png" alt="">
            <span>Witness #1</span>
        </button>

        <button class="witnessBtn" data-image="images/witness2_large.png">
            <img src="images/witness2_thumb.png" alt="">
            <span>Witness #2</span>
        </button>

        <button class="witnessBtn" data-image="images/witness3_large.png">
            <img src="images/witness3_thumb.png" alt="">
            <span>Witness #3</span>
        </button>

    </div>

    <!-- Popup -->
    <div id="imagePopup">
        <span id="closePopup">&times;</span>
        <img id="popupImage" src="">
    </div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
